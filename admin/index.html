<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PetVerse Admin</title>
<link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=3.0">
</head>
<body>

<section id="login" class="login-wrap" hidden>
 <form class="login" id="loginForm">
  <img src="../img/logo-mark.webp" alt="PetVerse">
  <h2>PetVerse Admin</h2>
  <p id="loginHint">Sign in to manage your shop · দোকান চালাতে লগইন করুন</p>
  <input name="user" type="hidden" value="" autocomplete="off">
  <input name="pass" type="password" placeholder="Password" autocomplete="current-password" required minlength="8" autofocus>
  <button class="btn" style="width:100%">Sign in</button>
  <div class="err" id="loginErr"></div>
 </form>
</section>

<div id="app" class="app" hidden>
 <header class="hd">
  <div class="hd-in">
   <a class="brand" href="#dashboard"><img src="../img/logo-mark.webp" alt=""><span><b class="notr">Pet<em>Verse</em></b><small>Shop Admin · দোকান পরিচালনা</small></span></a>
   <h1 id="pageTitle" hidden>Dashboard</h1>
   <span class="hd-sp"></span>
   <a class="hd-shop" href="../" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>View shop</span></a>
   <div class="bell-wrap"><button class="ic bell" onclick="toggleBell()" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><b id="bellN" hidden>0</b></button><div class="bell-pop" id="bellPop" hidden></div></div>
   <div class="me"><div><b id="meName">Admin</b><small id="meRole">Super Admin</small></div><button class="ic" title="Log out · লগ আউট" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg></button></div>
  </div>
  <nav id="nav" class="tnav" aria-label="Admin menu"></nav>
 </header>
 <div class="main">
  <main id="view" class="view"></main>
  <footer class="foot">© <span id="yr"></span> <b>PetVerse Admin</b>. All rights reserved.<span class="sig notr"><span>Designed &amp; developed by</span><a href="https://www.linkedin.com/in/abid-islam-a926ab2b5/" target="_blank" rel="noopener author"><span class="sg-i sg-li"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5.1c0-1.22-.02-2.78-1.7-2.78-1.7 0-1.96 1.33-1.96 2.7V21h-4z"/></svg></span>Abid Islam</a><a href="https://boostnixmedia.com/" target="_blank" rel="noopener"><span class="sg-i sg-bx">B</span>Boostnix Media</a></span></footer>
 </div>
</div>

<nav class="tabbar" id="tabbar">
 <a href="#dashboard" data-r="dashboard"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></a>
 <a href="#orders" data-r="orders"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg><span>Orders</span><b id="tbN" hidden></b></a>
 <a href="#product/new" class="add" data-r="product"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></a>
 <a href="#products" data-r="products"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg><span>Products</span></a>
 <a href="#bookings" data-r="bookings"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Bookings</span><b id="tbB" hidden></b></a>
</nav>
<div class="modal" id="modal" hidden><div class="modal-bg" onclick="closeModal()"></div><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>window.PV_PREFIX = "pvd"; /* demo storage name: give every shop its own (e.g. "cgd", "llx", "jbz") */</script>
<script src="admin.js?v=3.0"></script>
<script src="bookings.js?v=3.0"></script>
<script src="admin2.js?v=3.0"></script>
<script src="pv-top.js?v=3.0"></script>
<script src="pwd-eye.js?v=1"></script>
</body>
</html>
